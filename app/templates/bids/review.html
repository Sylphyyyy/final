{% extends 'base.html' %}

{% block content %}
<div class="flex flex-col gap-space-lg">
  <div>
    <h1 class="font-headline-xl text-headline-xl text-on-background tracking-tight">Review Extracted Bid Requirements</h1>
  </div>

  <section class="overflow-hidden rounded-xl border border-outline/30 bg-surface-container-lowest shadow-sm">
    <div class="flex items-center gap-space-sm border-b border-outline/30 bg-inverse-surface px-space-lg py-space-md text-inverse-on-surface">
      <span class="material-symbols-outlined text-primary-fixed">check_circle</span>
      <h2 class="font-headline-sm text-headline-sm">Extracted Requirements</h2>
    </div>
    <form action="{{ url_for('bid_upload.scan_bid') }}" method="POST">
      <div class="overflow-x-auto">
        <table class="min-w-full border-separate border-spacing-0 text-left">
          <thead class="bg-surface-container">
            <tr>
              <th class="px-space-md py-3 text-center font-label-sm text-label-sm uppercase tracking-wide text-on-surface-variant">Item No.</th>
              <th class="px-space-md py-3 font-label-sm text-label-sm uppercase tracking-wide text-on-surface-variant">Product Name</th>
              <th class="px-space-md py-3 font-label-sm text-label-sm uppercase tracking-wide text-on-surface-variant">Description</th>
              <th class="px-space-md py-3 text-center font-label-sm text-label-sm uppercase tracking-wide text-on-surface-variant">Quantity</th>
              <th class="px-space-md py-3 font-label-sm text-label-sm uppercase tracking-wide text-on-surface-variant">Unit</th>
              <th class="px-space-md py-3 text-right font-label-sm text-label-sm uppercase tracking-wide text-on-surface-variant">Budget (PHP)</th>
            </tr>
          </thead>
          <tbody>
            {% for item in items %}
            <tr class="align-top">
              <td class="border-t border-outline/20 px-space-md py-3">
                <input type="number" class="w-20 rounded-lg border border-outline bg-surface-container-lowest px-3 py-2 text-center" name="item_no[]" value="{{ item.item_no }}" readonly required>
              </td>
              <td class="border-t border-outline/20 px-space-md py-3">
                <input type="text" class="min-w-48 w-full rounded-lg border border-outline bg-surface-container-lowest px-3 py-2" name="item_name[]" value="{{ item.item_name }}" required>
              </td>
              <td class="border-t border-outline/20 px-space-md py-3">
                <textarea class="min-w-64 w-full rounded-lg border border-outline bg-surface-container-lowest px-3 py-2" name="description[]" rows="2" required>{{ item.description }}</textarea>
              </td>
              <td class="border-t border-outline/20 px-space-md py-3">
                <input type="number" class="w-24 rounded-lg border border-outline bg-surface-container-lowest px-3 py-2 text-center" name="quantity[]" value="{{ item.quantity }}" required>
              </td>
              <td class="border-t border-outline/20 px-space-md py-3">
                <input type="text" class="w-28 rounded-lg border border-outline bg-surface-container-lowest px-3 py-2" name="unit[]" value="{{ item.unit }}" required>
              </td>
              <td class="border-t border-outline/20 px-space-md py-3">
                <div class="flex items-center">
                  <span class="rounded-l-lg border border-r-0 border-outline bg-surface-container px-3 py-2">₱</span>
                  <input type="number" step="0.01" class="w-36 rounded-r-lg border border-outline bg-surface-container-lowest px-3 py-2 text-right" name="budget_php[]" value="{{ item.budget_php }}" required>
                </div>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      <div class="flex justify-end border-t border-outline/30 bg-surface-container-low px-space-lg py-space-md">
        <button type="submit" class="inline-flex w-full items-center justify-center gap-space-xs rounded-lg bg-primary px-space-lg py-3 font-label-md text-label-md text-on-primary shadow-sm transition-colors hover:bg-primary-container sm:w-auto">
          <span class="material-symbols-outlined text-[18px]">save</span>
          <span>Confirm and Save to Bid Request</span>
        </button>
      </div>
    </form>
  </section>
</div>
{% endblock %}
